name: SQLD Pass validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install (first online resolution; commit generated lock afterwards)
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run content:check
      - run: npm test
      - run: npm run typecheck:native
      - run: npx expo install --check
      - run: npx expo-doctor
      - run: npm run preview:build
      - name: Ensure draft cannot pass release gate
        run: |
          if npm run release:check; then
            echo 'Review why a draft is production eligible'; exit 1
          fi
