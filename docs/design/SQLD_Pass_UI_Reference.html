function I(name,cls=''){return `<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]||ICONS.info}</svg>`;}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function jsonArg(v){return JSON.stringify(v);}
function C(label,action,kind='primary',icon='',extra=''){return `<button type="button" class="btn ${kind}" onclick="${esc(action)}" ${extra}>${icon?I(icon):''}<span>${label}</span></button>`;}
function B(label,id,kind='primary',icon=''){return C(label,`go(${jsonArg(id)})`,kind,icon);}
function iconBtn(icon,action,label,cls=''){return `<button class="icon-btn ${cls}" onclick="${esc(action)}" aria-label="${esc(label)}">${I(icon)}</button>`;}
function badge(text,tone='',icon=''){return `<span class="badge ${tone}">${icon?I(icon):''}${text}</span>`;}
function progress(value,tone=''){return `<div class="progress ${tone}" role="progressbar" aria-valuenow="${value}" aria-valuemin="0" aria-valuemax="100"><span style="width:${Math.min(100,Math.max(0,value))}%"></span></div>`;}
function notice(text,tone='',icon='info'){return `<div class="notice ${tone}">${I(icon)}<span>${text}</span></div>`;}
function section(title,action='',label='전체 보기'){return `<div class="row between"><h2 class="section-title">${title}</h2>${action?`<button class="text-btn" onclick="${esc(action)}">${label}${I('chevron')}</button>`:''}</div>`;}
function card(inner,cls=''){return `<div class="card ${cls}">${inner}</div>`;}
function metric(label,value,unit='',icon=''){return `<div class="card mini-stat">${icon?I(icon):''}<span class="tiny muted">${label}</span><div class="stat-value">${value}<small>${unit}</small></div></div>`;}
function empty(icon,title,copy,button=''){return `<div class="empty-state"><div class="empty-illustration">${I(icon)}</div><h2>${title}</h2><p>${copy}</p>${button}</div>`;}
function rowLink(icon,label,id,value='',danger=false){return `<button class="settings-row${danger?' red':''}" onclick="go('${id}')">${I(icon)}<span class="grow">${label}</span>${value?`<span class="value">${value}</span>`:''}${I('chevron','chevron')}</button>`;}
function code(sql,label='SQL · 학습 예제'){let h=esc(sql).replace(/\b(SELECT|FROM|WHERE|INNER|LEFT|OUTER|JOIN|ON|AS|COUNT|IS|NULL|GROUP BY|HAVING|ORDER BY|DISTINCT|AND|SUM|AVG)\b/g,'<span class="kw">$1</span>');return `<div class="code-block"><div class="code-head"><span>${label}</span><span>SQL</span></div><pre><code>${h}</code></pre></div>`;}
function table(headers,rows){return `<div class="data-table-wrap"><table class="data-table"><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c===null?'<span class="null">NULL</span>':esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}

{title:'INNER JOIN',subject:2,prompt:'다음 SQL을 실행했을 때 조회되는 결과의 행 수는 몇 개일까요?',sql:'SELECT e.name, d.name\nFROM employee e\nINNER JOIN department d\n  ON e.department_id = d.id;',options:['1개','2개','3개','4개'],correct:1,why:'부서번호가 일치하는 민수(10)와 서윤(20)만 연결됩니다. 지우의 부서번호는 NULL이므로 등호 조인 조건을 만족하지 않습니다.',lesson:10,table:true},
{title:'COUNT와 NULL',subject:2,prompt:'employee 테이블에서 다음 SQL의 결과는 무엇일까요?',sql:'SELECT COUNT(department_id)\nFROM employee;',options:['0','1','2','3'],correct:2,why:'COUNT(열)은 해당 열이 NULL인 행을 제외합니다. department_id가 10과 20인 두 행만 계산하므로 결과는 2입니다.',lesson:8,table:true},
{title:'NULL 조건',subject:2,prompt:'부서번호가 없는 직원을 조회하는 올바른 조건을 고르세요.',sql:'SELECT name\nFROM employee\nWHERE /* 알맞은 조건 */;',options:['department_id = NULL','department_id IS NULL','department_id = 0','department_id <> NULL'],correct:1,why:'NULL 여부는 IS NULL로 검사합니다. NULL과의 일반 비교는 TRUE가 되지 않으므로 = NULL을 사용하지 않습니다.',lesson:7,table:false},
{title:'LEFT JOIN',subject:2,prompt:'왼쪽 employee 테이블을 기준으로 다음 SQL을 실행한 결과는 몇 행일까요?',sql:'SELECT e.name, d.name\nFROM employee e\nLEFT JOIN department d\n  ON e.department_id = d.id;',options:['1행','2행','3행','4행'],correct:2,why:'LEFT JOIN은 왼쪽 테이블의 모든 행을 유지합니다. 지우의 부서명은 NULL로 표시되며 결과는 3행입니다.',lesson:11,table:true},
{title:'데이터 모델링',subject:1,prompt:'직원 엔터티에서 각각의 직원을 유일하게 구별하기에 가장 적절한 속성은 무엇일까요?',sql:'',options:['중복 가능한 이름','재직 중인 부서명','중복되지 않는 직원번호','입사 연도'],correct:2,why:'식별자는 각 인스턴스를 유일하게 구분해야 합니다. 이름, 부서명, 입사 연도는 서로 다른 직원에게 중복될 수 있습니다.',lesson:3,table:false}
];

function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(S));storageAvailable=true;}catch(e){storageAvailable=false;toast('이 브라우저에서는 기록을 저장할 수 없습니다. 현재 화면에서만 유지됩니다.');}}
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3500);}
function activeExam(){return !!(S.exam&&S.exam.status==='active');}
function theme(){return S.theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):S.theme;}
function nav(active){return `<nav class="bottom-nav" aria-label="앱 하단 메뉴">${[['home','home','홈'],['catalog','book','학습'],['exams','timer','실전'],['stats','chart','기록']].map(([id,ic,t])=>`<button class="tab-btn ${active===id?'active':''}" onclick="go('${id}')" aria-label="${t}" ${active===id?'aria-current="page"':''}><span class="tab-icon">${I(ic)}</span><span>${t}</span></button>`).join('')}</nav>`;}
function shell(title,body,o={}){const main=!!o.nav;const stat=`<div class="statusbar" aria-hidden="true"><span>9:41</span><div class="status-icons">${I('signal')}${I('wifi')}<span class="battery"></span></div></div>`;let head=o.noHeader?'':`<header class="app-header ${main?'main':'detail'}">${main?`<div>${o.eyebrow?`<div class="overline">${o.eyebrow}</div>`:''}<h1>${title}</h1></div><div class="header-actions">${o.right||iconBtn('settings',"go('settings')",'설정')}</div>`:`${iconBtn(o.close?'close':'back',o.back||'back()',o.close?'닫기':'뒤로')}<h1>${title}</h1><div class="header-actions">${o.right||''}</div>`}</header>`;return `<div class="app ${theme()==='dark'?'dark':''}" style="--scale:${S.fontScale}" data-screen="${o.id||''}">${stat}${head}${o.banner||''}<div class="app-content ${o.contentClass||''}" tabindex="-1">${body}</div>${o.footer?`<div class="fixed-action">${o.footer}</div>`:''}${o.nav?nav(o.nav):''}<div class="home-indicator" aria-hidden="true"></div></div>`;}
function overlay(base,inner,id,preview=false){const under=renderScreen(base,preview,id==='unlock'?'rewarded':null);return under.replace(/<\/div>$/,`<div class="overlay" onclick="if(event.target===this)closeModal()"><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(SCREENS.find(s=>s.id===id)?.title||'확인')}" tabindex="-1"><div class="sheet-handle"></div>${iconBtn('close','closeModal()','닫기','sheet-close')}${inner}</section></div></div>`);}
function learningTabs(which){return `<div class="pill-switch" role="tablist" aria-label="학습 방식">${[['catalog','개념 학습'],['practiceSetup','문제 풀이'],['review','오답 복습']].map(([id,t])=>`<button role="tab" aria-selected="${which===id}" class="${which===id?'active':''}" onclick="go('${id}')">${t}</button>`).join('')}</div>`;}
function week(){return `<div class="week">${['월','화','수','목','금','토','일'].map((d,i)=>`<div class="week-day"><span>${d}</span><div class="week-dot ${i<4?'done':i===4?'today':''}">${i<5?I('check'):i===5?'7':'8'}</div></div>`).join('')}</div>`;}
function adBanner(preview=false){return S.scenario==='rewarded'&&(preview||!activeExam())?`<div class="ad-banner"><small>광고</small><div class="ad-placeholder">배너 광고 영역 · UI 미리보기</div></div>`:'';}
function schema(){return `<div class="schema"><div class="schema-table"><b>employee</b><p>name<br>department_id</p></div><div class="schema-join"><span>N : 1</span>${I('link')}</div><div class="schema-table"><b>department</b><p>id<br>name</p></div></div>`;}
function lessonRow(l){const read=S.read.includes(l.id);return `<button class="lesson-row" onclick="openLesson(${l.id})"><span class="lesson-num">${String(l.id).padStart(2,'0')}</span><div class="grow"><div class="lesson-name">${l.title}</div><div class="lesson-meta">${l.subject}과목 · 약 ${l.mins}분${read?' · 읽음':''}</div></div>${I(read?'checkCircle':'chevron',read?'green':'')}</button>`;}
function questionData(preview=false){const idx=preview?0:S.practice?.index||0;return {q:QUESTIONS[(preview?0:S.practice?.sequence?.[idx])??(idx%QUESTIONS.length)],index:idx,total:preview?5:S.practice?.limit||S.practiceLimit||5};}
function questionBody(q,tableMode=false){return `<div class="stack"><div class="row between">${badge(`${q.subject}과목 · ${q.title}`)}<span class="tiny subtle">학습용 예제</span></div><h2 class="question-title">${q.prompt}</h2>${q.table?`<div><div class="tiny muted" style="margin-bottom:7px">employee</div>${table(['name','department_id'],EMP)}${q.title.includes('JOIN')?`<div class="tiny muted" style="margin:12px 0 7px">department</div>${table(['id','name'],DEPT)}`:''}</div>`:''}${q.sql?code(q.sql):''}</div>`;}
function options(q,selected,submitted=false,action='choosePractice',disabled=false){return `<div class="stack tight" role="radiogroup" aria-label="답변 선택">${q.options.map((o,i)=>{const yes=submitted&&i===q.correct,no=submitted&&selected===i&&!yes,sel=selected===i;return `<button role="radio" aria-checked="${sel}" class="option ${yes?'correct':no?'wrong':sel?'selected':''}" onclick="${action}(${i})" ${submitted||disabled?'disabled':''}><span class="option-number">${yes?I('check'):no?I('close'):i+1}</span><span class="grow">${esc(o)}${yes?'<span class="option-status green">정답</span>':no?'<span class="option-status red">내 선택 · 오답</span>':''}</span></button>`;}).join('')}</div>`;}
function explanation(q,selected){return `<div class="stack">${notice(selected===q.correct?'정확하게 이해했어요.':'틀린 이유를 확인하면, 다음에는 기억할 수 있어요.',selected===q.correct?'green':'orange',selected===q.correct?'checkCircle':'info')}<h2 class="section-title">정답의 이유</h2><p class="body muted">${q.why}</p>${card(`<div class="tiny blue" style="margin-bottom:7px">이 개념으로 다시 연결</div><button class="row between" style="width:100%;text-align:left;min-height:36px" onclick="openLesson(${q.lesson})"><b class="small">${LESSONS.find(l=>l.id===q.lesson).title}</b>${I('chevron','small')}</button>`,'blue-tint')}<details class="small muted"><summary style="cursor:pointer;min-height:40px;padding-top:8px">다른 보기 해설</summary><p style="padding:10px 0;line-height:1.9">${q.options.map((o,i)=>i!==q.correct?`${i+1}번 ${esc(o)}: ${q.title==='INNER JOIN'?'조인 조건에 일치하는 행은 두 개이므로 이 보기의 행 수는 올바르지 않습니다.':'위의 핵심 규칙과 일치하지 않습니다.'}`:'').filter(Boolean).join('<br>')}</p></details><button class="text-btn muted" onclick="go('report')">${I('flag')}문항 오류 제보</button></div>`;}
function sampleAnswers(){const a={};for(let i=0;i<35;i++)if(i!==8&&i!==15)a[i]=examQuestion(i).correct;return a;}

function timerMarkup(preview=false){return `<div class="timer${!preview&&remaining()<600?' warning':''}">${I('timer')}<span class="exam-timer">${preview?'72:18':fmt(remaining())}</span></div>`;}

  case 'appearance':body=`<div class="stack loose"><div><h2 class="page-title">눈에 편안한<br>나만의 학습 화면.</h2><p class="small muted" style="margin-top:8px">전체 화면에 같은 설정이 적용돼요.</p></div><div><label class="form-label">화면 테마</label><div class="row">${[['light','라이트'],['dark','다크'],['system','시스템']].map(([v,t])=>`<button class="appearance-option ${S.theme===v?'active':''}" onclick="setValue('theme','${v}')"><div class="appearance-preview ${v==='dark'?'dark-preview':''}"><span></span><span></span><i></i></div><div class="appearance-label">${t}</div></button>`).join('')}</div></div><div><div class="row between"><label class="form-label" for="font-scale">글자 크기</label><span class="tiny blue">${Math.round(S.fontScale*100)}%</span></div><input class="slider" id="font-scale" type="range" min="100" max="120" step="10" value="${Math.round(S.fontScale*100)}" onchange="setFontScale(this.value)"><div class="row between tiny muted"><span>기본</span><span>크게</span></div></div><div class="card"><span class="tiny blue">미리보기</span><h3 class="section-title" style="margin-top:11px">읽기 좋은 크기로, 더 선명하게.</h3><p class="body muted" style="margin-top:9px">INNER JOIN은 조인 조건에 일치하는 행을 연결합니다. 나에게 편한 크기를 선택하세요.</p></div></div>`;return shell('화면 · 글자 크기',body,{...o,footer:B('설정으로 돌아가기','settings','primary','check')});
  case 'privacy':body=`<div class="stack loose"><div><div class="empty-illustration" style="margin-left:0">${I('shield')}</div><h2 class="page-title">공부 기록은,<br>나의 기기에.</h2><p class="small muted" style="margin-top:11px">SQLD Pass는 계정을 만들지 않아도<br>학습을 이어갈 수 있어요.</p></div><div class="card stack"><h3 class="section-title">기기에 저장되는 정보</h3>${['목표 시험일과 학습 환경 설정','이론 읽음, 북마크, 문제풀이 기록','복습 일정과 모의고사 결과',...(scenario==='rewarded'?['광고로 해제한 모의고사 내역']:[])].map(t=>`<div class="checkline">${I('check')}<span>${t}</span></div>`).join('')}</div>${notice('앱 삭제·전체 데이터 삭제·재설치·기기 변경 후에는 학습 기록과 해제 내역을 복원할 수 없어요.','orange')}<div><h3 class="section-title">${scenario==='rewarded'?'광고 이용 시 별도 안내':'이용하지 않는 기능'}</h3><p class="body muted" style="margin-top:9px">${scenario==='rewarded'?'광고가 활성화된 버전에서는 Google 광고 SDK가 광고 제공에 필요한 정보를 처리합니다. 기기 내 학습 기록 저장과는 별도로 안내해야 합니다.':'이 기본 무료 버전은 로그인, 광고, 원격 학습 분석, 클라우드 동기화, 앱 내 결제를 사용하지 않습니다.'}</p></div>${scenario==='rewarded'?B('광고 개인정보 설정','adsPrivacy','secondary','shield'):''}<p class="tiny subtle">화면 문구 시안입니다. 최종 개인정보처리방침과 배포 설정의 일치 여부는 출시 전 확인이 필요합니다.</p></div>`;return shell('개인정보 안내',body,o);
  case 'adsPrivacy':body=`<div class="stack loose"><div>${badge('광고 운영형 전용','gray')}<h2 class="page-title" style="margin-top:13px">광고와 개인정보,<br>따로 확인할 수 있어요.</h2></div>${notice('광고 SDK의 실제 개인정보 설정 화면은 앱과 기기·지역의 요구 사항에 따라 달라질 수 있습니다.')}<div class="card stack"><h3 class="section-title">알아두세요.</h3><p class="body muted">학습 기록은 기기에 저장됩니다. 광고가 활성화되면 광고 제공에 필요한 정보는 Google 광고 SDK에 의해 처리될 수 있습니다.</p><p class="body muted">광고 관련 선택을 변경해도 이미 해제한 회차와 무료 학습 기록은 임의로 삭제하지 않습니다.</p></div>${C('광고 개인정보 설정 열기',"toast('실제 앱에서는 광고 SDK의 개인정보 설정 화면으로 연결됩니다. HTML에서는 SDK를 호출하지 않습니다.')",'secondary','external')}<p class="tiny subtle">이 화면은 SDK 진입 안내 시안입니다. UMP 동의 화면이나 iOS 시스템 권한 화면을 직접 구현한 것이 아닙니다.</p></div>`;return shell('광고 개인정보 설정',body,o);
  case 'data':body=`<div class="stack loose"><div><h2 class="page-title">나의 기록,<br>삭제 전에 한 번 더.</h2><p class="small muted" style="margin-top:10px">초기화 범위에 따라 남는 기록이 달라요.</p></div><div class="card"><div class="row"><div class="icon-tile">${I('database')}</div><div><b class="section-title">이 기기에 저장 중</b><p class="tiny muted">학습 기록 · 설정 · 회차 해제 내역</p></div></div></div><div class="settings-list">${rowLink('refresh','학습 기록만 초기화','resetLearning')}${rowLink('trash','전체 데이터 삭제','resetAll','',true)}</div>${card(`<h3 class="section-title">무엇이 달라지나요?</h3><p class="small muted" style="margin-top:12px"><b class="blue">학습만 초기화</b><br>진도, 북마크, 풀이와 결과를 지워요.<br>광고로 해제한 모의고사는 유지돼요.</p><div class="divider" style="margin:16px 0"></div><p class="small muted"><b class="red">전체 데이터 삭제</b><br>학습 기록, 설정, 해제 내역을 모두 지워요.<br>처음 시작하는 상태로 돌아가요.</p>`)}${notice('백업·동기화·복원 기능은 제공하지 않습니다. 삭제한 기록은 되돌릴 수 없어요.','orange')}</div>`;return shell('기기 데이터 관리',body,o);
  case 'resetLearning':return overlay('data',`${badge('되돌릴 수 없는 작업','orange')}<h2 class="sheet-title">학습 기록을 초기화할까요?</h2><p class="sheet-copy">진도, 북마크, 문제풀이와 시험 결과가 삭제됩니다.<br><b>광고로 해제한 모의고사는 유지돼요.</b><br>삭제한 학습 기록은 복원할 수 없습니다.</p><div class="stack">${C('학습 기록만 초기화','resetLearning()','danger','refresh')}${B('기록 유지하기','data','secondary')}</div>`,'resetLearning',preview);
  case 'resetAll':return overlay('data',`${badge('전체 삭제','red')}<h2 class="sheet-title">모든 기록을 삭제할까요?</h2><p class="sheet-copy">학습 기록, 설정, 광고로 해제한 회차까지<br>이 기기의 SQLD Pass 기록이 모두 삭제됩니다.<br><b>이 작업은 되돌릴 수 없습니다.</b></p><label class="row small" style="align-items:flex-start;margin:14px 0 22px;cursor:pointer"><input type="checkbox" ${S.resetAgree?'checked':''} onchange="setValue('resetAgree',this.checked)" style="width:19px;height:19px;accent-color:var(--danger);flex-shrink:0"><span>삭제 범위와 복원 불가를 확인했습니다.</span></label><div class="stack">${C('모든 기록 삭제','resetAll()','danger','trash',!S.resetAgree?'disabled':'')}${B('취소','data','secondary')}</div>`,'resetAll',preview);
  case 'help':body=`<div class="stack loose"><div><h2 class="page-title">막히는 곳이 있다면,<br>함께 확인해요.</h2><p class="small muted" style="margin-top:8px">자주 묻는 질문부터 살펴보세요.</p></div><div class="faq">${[['로그인 없이 기록이 저장되나요?','학습 기록은 이 기기에 저장됩니다. 계정이나 클라우드 동기화는 사용하지 않습니다.'],['기기를 바꾸면 기록을 옮길 수 있나요?','현재 앱 자체 기록 복원과 기기 간 동기화는 지원하지 않습니다. 앱 삭제와 기기 변경 전에 이 점을 확인해 주세요.'],['시험 중 앱을 나가면 시간이 멈추나요?','멈추지 않습니다. 시험 시작 시점부터 90분이 계속 흐르며, 시간이 끝나면 현재 답안으로 자동 제출합니다.'],['모의고사 해설에도 광고가 필요한가요?','아니요. 열려 있는 회차의 재응시와 제출 후 해설에는 추가 광고가 필요하지 않습니다. 기본 무료형에서는 모든 회차에 광고가 없습니다.'],['인터넷 없이 공부할 수 있나요?','기기에 포함된 이론과 문제는 이용할 수 있습니다. 광고 운영형에서 새 광고를 불러올 때에는 인터넷 연결이 필요합니다.']].map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}</div><button class="shortcut" onclick="go('report')"><div class="icon-tile">${I('mail')}</div><div class="grow"><b>찾는 답이 없나요?</b><p class="tiny muted">오류나 의견을 남겨주세요.</p></div>${I('chevron','small')}</button>${notice('문의에 학습 답안이나 개인정보를 자동 첨부하지 않습니다. 불필요한 개인정보는 적지 마세요.')}</div>`;return shell('도움말 · 고객지원',body,o);
  case 'report':body=`<div class="stack loose"><div><h2 class="page-title">더 정확한 공부를 위해<br>알려주세요.</h2><p class="small muted" style="margin-top:9px">문항이나 화면에서 발견한 문제를 적어주세요.</p></div><div><label class="form-label" for="report-type">문의 유형</label><select id="report-type" class="input"><option>문항 · 정답 · 해설 오류</option><option>화면 · 기능 오류</option><option>개선 제안</option><option>기타 문의</option></select></div>${card(`<span class="tiny muted">관련 항목</span><p class="small" style="margin-top:6px">확인 문제 · INNER JOIN</p><p class="tiny subtle">문항 ID: UI-DEMO-Q001 · UI Reference v1.0</p>`)}<div><label class="form-label" for="report-text">내용</label><textarea class="input" id="report-text" placeholder="어떤 점이 이상했나요? 기대한 결과와 실제 결과를 함께 적어주세요." oninput="S.reportDraft=this.value;persist()">${esc(S.reportDraft||'')}</textarea></div>${notice('문의 초안에는 항목 ID와 버전만 포함돼요. 학습 답안·진도는 자동 첨부하지 않습니다.')}<p class="tiny subtle">HTML에서는 실제 메일을 보내지 않아요. 작성한 문의 초안을 복사해 사용할 수 있어요.</p></div>`;return shell('오류 · 의견 제보',body,{...o,footer:C('문의 초안 복사하기','copyReport()','primary','copy')});
  case 'about':body=`<div class="stack loose"><div class="center"><div class="version-icon">S.</div><h2 class="page-title">SQLD Pass</h2><p class="small muted" style="margin-top:6px">매일의 개념이 실전의 자신감으로.</p><p class="tiny subtle" style="margin-top:9px">운영 UI Reference · 1.0</p></div><div class="card stack"><h3 class="section-title">수록 콘텐츠 구성</h3>${[['핵심 이론','60개'],['확인 문제','120문항'],['모의고사','20회 · 1,000문항']].map(([t,n])=>`<div class="row between"><span class="small muted">${t}</span><b class="small">${n}</b></div>`).join('')}</div><div><h3 class="section-title">학습을 위한 독립 서비스</h3><p class="body muted" style="margin-top:10px">자체 제작한 학습 콘텐츠를 제공하는 독립 앱입니다. 실제 시험 문제나 공식 합격 판정을 제공하는 서비스가 아닙니다.</p></div>${notice('현재 HTML의 문제, 진도, 점수는 UI 동작을 설명하기 위한 예시입니다. 실제 전체 콘텐츠 팩은 포함되어 있지 않습니다.')}<div class="settings-list">${rowLink('shield','개인정보 안내','privacy')}${rowLink('question','도움말 · 고객지원','help')}</div><p class="tiny subtle center">Repository · kasa500000-png/SQLD-Pass<br>Reference baseline · d2925f4</p></div>`;return shell('앱 · 콘텐츠 정보',body,o);
  case 'unlock':return overlay('exams',`${badge('모의고사 '+String(Math.max(5,S.selectedExam)).padStart(2,'0')+'회','gray','lock')}<h2 class="sheet-title">광고 한 번으로,<br>이 회차는 계속 열어둘게요.</h2><p class="sheet-copy">보상형 광고를 끝까지 보면 이 기기에서<br>해당 회차를 계속 이용할 수 있어요.</p><div class="card stack tight" style="margin-bottom:19px"><div class="checkline">${I('check')}<span>이 회차의 문제와 제출 후 해설</span></div><div class="checkline">${I('check')}<span>재응시에는 추가 광고 없음</span></div><div class="checkline">${I('check')}<span>1–4회와 이론·복습은 계속 무료</span></div></div><p class="tiny muted" style="margin-bottom:18px">앱 삭제·전체 데이터 삭제·기기 변경 시 해제 내역을 복원할 수 없어요.</p><div class="stack">${C('광고 보고 회차 열기','startAd()','primary','play')}${B('다음에 할게요','exams','ghost')}</div>`,'unlock',preview);

function render(keepScroll=false){
  const host=document.getElementById('app-host');const oldScroll=host.querySelector('.app-content')?.scrollTop||0;
  host.innerHTML=renderScreen(current,false);
  if(keepScroll){const content=host.querySelector('.app-content');if(content)content.scrollTop=oldScroll;}
  const modal=host.querySelector('[role="dialog"]');
  if(modal){host.querySelectorAll('.app > :not(.overlay)').forEach(n=>{n.inert=true;n.setAttribute('aria-hidden','true');});modal.focus({preventScroll:true});}
  document.getElementById('stage-title').textContent=SCREENS.find(s=>s.id===current)?.title||'홈';
  document.title=`SQLD Pass · ${SCREENS.find(s=>s.id===current)?.title||'UI Reference'}`;
  renderNav();renderInspector();
  if(viewMode==='gallery'){galleryBuilt=false;buildGallery();}
}
function renderNav(){
 const q=navQuery.toLowerCase();let out='';for(const g of GROUPS){const list=SCREENS.filter(s=>s.group===g&&(!q||`${s.title} ${s.group} ${s.id}`.toLowerCase().includes(q)));if(!list.length)continue;out+=`<div class="nav-group">${g}<span>${list.length}</span></div>${list.map(s=>`<button class="screen-link ${s.id===current?'active':''}" onclick="openReference('${s.id}')" ${s.id===current?'aria-current="page"':''}><span class="id">${s.number}</span><span>${s.title}</span></button>`).join('')}`;}
 document.getElementById('screen-nav').innerHTML=out||'<p class="small muted" style="padding:20px">일치하는 화면이 없습니다.</p>';
 document.getElementById('screen-total').textContent=`${SCREENS.length} SCREENS · 4 CORE TABS`;
}

 const mobileScenario=document.getElementById('mobile-scenario');if(mobileScenario)mobileScenario.value=S.scenario;
 const s=SCREENS.find(s=>s.id===current)||SCREENS[2];const next=SCREENS[(SCREENS.indexOf(s)+1)%SCREENS.length];
 const path=s.group==='광고·시스템'||s.id==='adsPrivacy'?PATHS.ads:['settings','privacy','data','help','report','about','resetLearning','resetAll'].includes(s.id)?PATHS.settings:PATHS.lesson;
 document.getElementById('inspector').innerHTML=`<div class="inspector-kicker">SCREEN ${s.number} / ${SCREENS.length}</div><h2>${s.title}</h2><p class="inspector-description">${s.description}</p><span class="inspector-tag">${s.group}</span><div class="inspector-section"><h3>화면에서 해볼 수 있는 것</h3>${s.flows.map(t=>`<div class="flow-step">${t}</div>`).join('')}</div><div class="inspector-section"><h3>운영 시나리오</h3><select class="inspector-select" aria-label="운영 시나리오" onchange="setScenario(this.value)"><option value="launch-free" ${S.scenario==='launch-free'?'selected':''}>기본 출시형 · 20회 무료</option><option value="rewarded" ${S.scenario==='rewarded'?'selected':''}>광고 운영형 · 5–20회 해제</option></select><p class="inspector-note" style="margin-top:10px">실제 광고·결제·메일·OS 알림은 실행되지 않습니다. 모든 기록은 이 HTML 전용 예시 데이터입니다.</p></div><div class="inspector-section"><h3>일관된 디자인 언어</h3><div class="mini-swatches"><span style="background:#2457d6"></span><span style="background:#edf3ff"></span><span style="background:#172033"></span><span style="background:#e6eaf1"></span><span style="background:#16836b"></span></div><p class="inspector-note">블루 포인트 · 가벼운 표면 · 4개 탭<br>주요 버튼 44px 이상 · 공통 테마 토큰</p></div><div class="inspector-section"><h3>기존 코드 연결점</h3><div class="mono-path">${path}<br>route / ${s.source}</div><p class="inspector-note" style="margin-top:10px">화면 제안 기준: d2925f4<br>시험 UI는 5개 예제 문항을 반복해 동작을 시연합니다. 전체 문항집이 아닙니다.</p></div><button class="next-screen" onclick="openReference('${next.id}')"><span>다음 · ${next.title}</span>${I('arrow','small')}</button><button class="next-screen" onclick="resetDemo()"><span>예시 상태 처음으로</span>${I('refresh','small')}</button>`;
}
function go(id){if(!SCREENS.some(s=>s.id===id)){toast('화면을 찾지 못했습니다.');return;}if(current!==id){routeStack.push(current);current=id;location.hash=id;}document.body.classList.remove('sidebar-open');render();}
function openReference(id){if(['unlock','adPlaying','adSuccess','adUnavailable','adCancelled','adsPrivacy'].includes(id)){S.scenario='rewarded';S.selectedExam=Math.max(5,S.selectedExam);persist();}if(viewMode!=='prototype')setView('prototype');go(id);}
function back(){const fallback={home:'home',catalog:'home',exams:'home',stats:'home',lesson:'catalog',lessonSummary:'lesson',day:'plan',practice:'catalog',practiceCorrect:'catalog',practiceWrong:'catalog',reviewDetail:'review',result:'exams',resultWeak:'exams',examIntro:'exams',privacy:'settings',about:'settings'};const target=routeStack.pop()||fallback[current]||'home';current=target;location.hash=target;render();}

function setDevice(width,el){const phone=document.getElementById('phone');phone.style.width=width+'px';phone.classList.toggle('tablet',width>500);document.querySelectorAll('.stage-tools button').forEach(b=>b.classList.remove('active'));el?.classList.add('active');document.getElementById('device-size').textContent=width+' × 844';}
function setView(mode){viewMode=mode;document.body.classList.toggle('mode-gallery',mode==='gallery');document.getElementById('prototype-mode').classList.toggle('active',mode==='prototype');document.getElementById('gallery-mode').classList.toggle('active',mode==='gallery');if(mode==='gallery')buildGallery();}
function buildGallery(){if(galleryBuilt)return;const q=navQuery.toLowerCase();const list=SCREENS.filter(s=>!q||`${s.title} ${s.group} ${s.id}`.toLowerCase().includes(q));document.getElementById('gallery-grid').innerHTML=list.map(s=>`<article class="gallery-item" role="button" tabindex="0" aria-label="${s.title} 화면 열기" onclick="openReference('${s.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openReference('${s.id}');}"><div class="mini-viewport" inert aria-hidden="true"><div class="mini-phone">${renderScreen(s.id,true)}</div></div><div class="gallery-label"><span>${s.number}</span>${s.title}</div></article>`).join('');galleryBuilt=true;}
function setValue(key,value,redraw=true){S[key]=value;persist();galleryBuilt=false;if(redraw)render(true);}
function toggleTheme(){S.theme=theme()==='dark'?'light':'dark';persist();galleryBuilt=false;render(true);}
function setFontScale(value){S.fontScale=Number(value)/100;persist();render(true);}

function searchLessons(input){const pos=input.selectionStart;S.search=input.value;current='catalog';render();const field=document.getElementById('lesson-search');field?.focus({preventScroll:true});field?.setSelectionRange(pos,pos);}

function questionSequence(limit){const available=QUESTIONS.map((q,i)=>({q,i})).filter(({q})=>S.practiceSubject==='all'||String(q.subject)===S.practiceSubject).map(x=>x.i);return Array.from({length:limit},(_,i)=>available[i%available.length]);}
function startPractice(mode='normal',limit=S.practiceLimit){S.practice={mode,limit,index:0,selected:null,uncertain:false,submitted:false,responses:{},sequence:questionSequence(limit)};S.learningReset=false;persist();go('practice');}
function ensurePractice(){if(!S.practice)S.practice={mode:'normal',limit:S.practiceLimit,index:0,selected:null,uncertain:false,submitted:false,responses:{},sequence:questionSequence(S.practiceLimit)};return S.practice;}
function choosePractice(value){const p=ensurePractice();if(p.submitted)return;p.selected=value;persist();render(true);}
function toggleUncertain(){const p=ensurePractice();p.uncertain=!p.uncertain;persist();render(true);}
function submitPractice(){const p=ensurePractice();if(p.selected===null){toast('답변을 먼저 선택해 주세요.');return;}const {q}=questionData();p.submitted=true;p.responses[p.index]={selected:p.selected,correct:p.selected===q.correct,uncertain:p.uncertain};persist();go(p.selected===q.correct?'practiceCorrect':'practiceWrong');}
function nextPractice(){const p=ensurePractice();if(!p.responses[p.index])p.responses[p.index]={selected:current==='practiceCorrect'?questionData().q.correct:0,correct:current==='practiceCorrect',uncertain:false};if(p.index>=p.limit-1){const rows=Object.values(p.responses);S.practiceResult={total:p.limit,correct:rows.filter(r=>r.correct).length,uncertain:rows.filter(r=>r.uncertain).length};S.practice=null;persist();go('practiceResult');return;}p.index++;p.selected=null;p.uncertain=false;p.submitted=false;persist();go('practice');}
function resumePractice(){if(!S.practice){startPractice();return;}const q=questionData().q;go(S.practice.submitted?(S.practice.selected===q.correct?'practiceCorrect':'practiceWrong'):'practice');}
function leavePractice(){persist();go('catalog');toast('풀던 문제는 예시 기록에 남겨두었어요.');}
function examQuestion(index){return index<10?QUESTIONS[4]:QUESTIONS[(index-10)%4];}
function openExam(n){S.selectedExam=n;persist();if(activeExam()){if(S.exam.examId===n){go('exam');return;}toast('먼저 진행 중인 모의고사를 마쳐주세요.');go('examResume');return;}if(n===1){S.lastExam=null;go('result');return;}if(S.scenario==='rewarded'&&n>4&&!S.unlocked.includes(n)){go('unlock');return;}go('examIntro');}
function startExam(){if(activeExam()){resumeExam();return;}const n=S.selectedExam;if(S.scenario==='rewarded'&&n>4&&!S.unlocked.includes(n)){go('unlock');return;}S.exam={status:'active',examId:n,index:0,answers:{},flags:[],started:Date.now(),deadline:Date.now()+90*60*1000};S.lastExam=null;persist();go('exam');}
function ensureExam(){if(!activeExam()){const e=examModel(true);S.exam={...e,status:'active',started:Date.now(),deadline:Date.now()+4338*1000};persist();}return S.exam;}
function resumeExam(){ensureExam();go('exam');}
function chooseExam(value){const e=ensureExam();e.answers[e.index]=value;persist();render(true);}
function flagExam(){const e=ensureExam();e.flags=e.flags.includes(e.index)?e.flags.filter(x=>x!==e.index):[...e.flags,e.index];persist();render(true);}
function moveExam(delta){const e=ensureExam();e.index=Math.max(0,Math.min(49,e.index+delta));persist();go('exam');}
function jumpExam(index){const e=ensureExam();e.index=index;persist();go('exam');}
function submitExam(timeout=false){const e=ensureExam();if(e.status!=='active')return;let correct=0,s1=0,s2=0;for(let i=0;i<50;i++){const q=examQuestion(i);if(e.answers[i]===q.correct){correct++;if(q.subject===1)s1+=2;else s2+=2;}}S.lastExam={score:correct*2,correct,total:50,unanswered:50-Object.keys(e.answers).length,s1,s2,answers:{...e.answers},examId:e.examId,submittedAt:Date.now()};e.status='submitted';S.examReviewIndex=0;S.selectedExam=e.examId;persist();go(timeout?'timeout':'result');}
function moveReview(delta){S.examReviewIndex=Math.max(0,Math.min(49,(S.examReviewIndex||0)+delta));go('examReview');}

function showDayRecord(day){document.getElementById('day-record').innerHTML=day===2?`<div class="row between"><h3 class="section-title">11월 2일의 학습</h3>${badge('18문항','green')}</div><p class="small muted">INNER JOIN 개념 학습<br>확인 문제 10문항 · 복습 8문항</p>`:day===1?`<h3 class="section-title">11월 1일의 학습</h3><p class="small muted">확인 문제 12문항을 풀었어요.</p>`:`<h3 class="section-title">11월 ${day}일</h3><p class="small muted">이 예시 날짜에는 아직 학습 기록이 없어요.</p>`;}
function resetLearning(){S.read=[];S.bookmarks=[];S.practice=null;S.practiceResult=null;S.exam=null;S.lastExam=null;S.learningReset=true;persist();go('homeNew');toast('레퍼런스의 학습 예시 기록을 초기화했어요. 해제 내역은 유지됩니다.');}
function resetAll(){if(!S.resetAgree)return;try{localStorage.removeItem(STORAGE_KEY);}catch(e){}S={...structuredClone(BASE),bookmarks:[],read:[],unlocked:[],onboarded:false,learningReset:true};persist();routeStack=[];go('welcome');toast('이 HTML 전용 예시 기록만 삭제했습니다. 실제 앱 데이터에는 영향이 없습니다.');}
function resetDemo(){S=structuredClone(BASE);persist();routeStack=[];galleryBuilt=false;go('home');toast('UI 예시 상태를 처음으로 되돌렸어요.');}
async function copyReport(){const text=document.getElementById('report-text')?.value?.trim();if(!text){toast('문의 내용을 먼저 입력해 주세요.');return;}const category=document.getElementById('report-type')?.value||'문의';const draft=`[SQLD Pass 문의 초안]\n유형: ${category}\n문항 ID: UI-DEMO-Q001\n버전: UI Reference 1.0\n\n${text}\n\n학습 답안과 진도는 첨부하지 않았습니다.`;let copied=false;try{await navigator.clipboard.writeText(draft);copied=true;}catch(e){const area=document.createElement('textarea');area.value=draft;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();try{copied=document.execCommand('copy');}catch(e){}area.remove();}toast(copied?'문의 초안을 복사했어요. 실제 메일은 전송되지 않았습니다.':'브라우저가 복사를 허용하지 않습니다. 입력한 내용을 직접 선택해서 복사해 주세요.');}
function retryDemo(){go('loading');setTimeout(()=>{if(current==='loading'){go('home');toast('준비 완료 화면으로 전환한 UI 시연입니다.');}},1000);}
function retryStorage(){persist();if(storageAvailable){go('home');toast('이 HTML 전용 예시 기록을 브라우저에 저장했어요.');}else toast('브라우저 저장소에 접근할 수 없습니다. 기존 데이터를 삭제하지 않았습니다.');}
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id!==current&&SCREENS.some(s=>s.id===id)){current=id;render();}});
document.addEventListener('keydown',e=>{const modal=document.querySelector('#app-host [role="dialog"]');if(e.key==='Escape'){if(modal)closeModal();else document.body.classList.remove('sidebar-open');}if(e.key==='Tab'&&modal){const focusable=[...modal.querySelectorAll('button:not(:disabled),input:not(:disabled),select,textarea,a[href],[tabindex="0"]')].filter(n=>n.offsetParent!==null);if(!focusable.length){e.preventDefault();return;}const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===modal)){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
setInterval(()=>{if(!activeExam())return;const sec=remaining();document.querySelectorAll('#app-host .exam-timer').forEach(el=>{el.textContent=fmt(sec);el.closest('.timer')?.classList.toggle('warning',sec<600);});if(sec<=0)submitExam(true);},1000);
window.addEventListener('pagehide',()=>persist());
if(qs.get('mode')==='app')document.body.classList.add('app-only');
render();if(qs.get('view')==='gallery')setView('gallery');
window.SQLD_REFERENCE={screens:SCREENS,revision:REVISION,getState:()=>structuredClone(S),renderScreen,go,resetDemo};
</script></body></html>
