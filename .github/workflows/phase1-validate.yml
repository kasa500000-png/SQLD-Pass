name: SQLD Pass validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Core tests
        run: npm test
      - name: Native typecheck
        run: npm run typecheck:native
      - name: Expo compatibility
        run: |
          npx expo install --check
          npx expo-doctor
      - name: Full content check when pack is present
        run: |
          if [ -f content-pack/content.json.gz ] || [ -f generated/content.json.gz ]; then
            npm run content:materialize
            npm run content:check
          else
            echo 'Full Phase 1 content pack is intentionally not materialized in this migration yet.'
          fi
      - name: Draft must not pass production release gate
        run: |
          if npm run release:check; then
            echo 'Review why an unapproved build became production eligible'; exit 1
          fi
