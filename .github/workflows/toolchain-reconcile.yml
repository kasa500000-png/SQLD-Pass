name: SQLD Pass toolchain reconciliation
on:
  workflow_dispatch:
  push:
    branches: [work/learning-ui-polish-20260912]
    paths: [.github/workflows/toolchain-reconcile.yml]
permissions:
  contents: write
concurrency:
  group: sqld-toolchain-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.repository == 'kasa500000-png/SQLD-Pass' && github.ref == 'refs/heads/work/learning-ui-polish-20260912'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_PUBLIC_APP_ENV: internal
      EXPO_PUBLIC_ADS_MODE: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/learning-ui-polish-20260912
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply only the compatibility changes observed in the prior install audit
        shell: bash
        run: |
          mkdir -p /tmp/sqld-toolchain
          git rev-parse HEAD > /tmp/sqld-toolchain/base-commit.txt
          node <<'NODE'
          const fs = require('node:fs');
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const write = (p, x) => fs.writeFileSync(p, JSON.stringify(x, null, 2) + '\n');
          const pkg = read('package.json');
          if (pkg.name !== 'sqld-pass') throw new Error('Wrong standalone project');
          const patches = {
            expo: ['57.0.18', '57.0.22'],
            'expo-build-properties': ['57.0.15', '57.0.17'],
            'expo-crypto': ['57.0.2', '57.0.3'],
            'expo-dev-client': ['57.0.16', '57.0.19'],
            'expo-sqlite': ['57.0.2', '57.0.3']
          };
          for (const [name, [before, after]] of Object.entries(patches)) {
            if (![before, after].includes(pkg.dependencies[name])) throw new Error('Unexpected concurrent version change: ' + name);
            pkg.dependencies[name] = after;
          }
          const core = read('tsconfig.core.json');
          if (!['Node', 'node', 'Node16', 'node16'].includes(core.compilerOptions.moduleResolution)) throw new Error('Unexpected module resolution');
          core.compilerOptions.module = 'Node16';
          core.compilerOptions.moduleResolution = 'Node16';
          const native = read('tsconfig.json');
          native.compilerOptions.types = [...new Set([...(native.compilerOptions.types || []), 'node', 'react'])];
          write('package.json', pkg);
          write('tsconfig.core.json', core);
          write('tsconfig.json', native);
          NODE
      - name: Install exact declared dependencies and produce a real lockfile
        shell: bash
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee /tmp/sqld-toolchain/install.log
      - name: Check common and native source, SDK versions and isolated monetization tests
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/sqld-toolchain/core.log 2>&1
          core=$?
          npm run typecheck:native > /tmp/sqld-toolchain/native.log 2>&1
          native=$?
          npx --no-install expo install --check > /tmp/sqld-toolchain/sdk.log 2>&1
          sdk=$?
          npm run test:monetization > /tmp/sqld-toolchain/monetization.log 2>&1
          monetization=$?
          printf '{"core":%s,"native":%s,"sdk":%s,"monetization":%s}\n' "$core" "$native" "$sdk" "$monetization" > /tmp/sqld-toolchain/results.json
          cat /tmp/sqld-toolchain/results.json
          test "$core" -eq 0 && test "$native" -eq 0 && test "$sdk" -eq 0 && test "$monetization" -eq 0
      - name: Record narrowly scoped successful source checks
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package-lock.json')); if(p.packages[''].name!=='sqld-pass'&&p.name!=='sqld-pass')throw Error('Wrong lock'); console.log('lockfile version',p.lockfileVersion)"
          git diff --check
          git diff -- package.json tsconfig.core.json tsconfig.json > /tmp/sqld-toolchain/config.diff
          git add package.json package-lock.json tsconfig.core.json tsconfig.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: align Expo patches and TypeScript 6 module/global types'
            git push origin HEAD:work/learning-ui-polish-20260912
          fi
          git rev-parse HEAD > /tmp/sqld-toolchain/verified-source-commit.txt
          git archive --format=zip --output=/tmp/sqld-toolchain/source.zip HEAD
          echo 'Source-only checks passed. Full-content integration, native binaries, devices and live ads have NOT been verified.' >> "$GITHUB_STEP_SUMMARY"
      - name: Keep evidence even when verification fails
        if: always()
        run: |
          if [ -f package-lock.json ]; then cp package-lock.json /tmp/sqld-toolchain/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqld-toolchain-${{ github.run_id }}
          path: /tmp/sqld-toolchain/
          retention-days: 7
          if-no-files-found: error
