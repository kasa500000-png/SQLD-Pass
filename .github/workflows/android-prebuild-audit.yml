name: SQLD Pass Android prebuild audit
on:
  workflow_dispatch:
  push:
    branches: [work/learning-ui-polish-20260912]
    paths: [.github/workflows/android-prebuild-audit.yml]
permissions:
  contents: read
concurrency:
  group: sqld-android-prebuild-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prebuild-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_PUBLIC_APP_ENV: internal
      EXPO_PUBLIC_ADS_MODE: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require verified lock and install exact dependencies
        run: |
          test -f package-lock.json
          npm ci --no-audit --no-fund
      - name: Re-run source and Expo diagnostics
        run: |
          npm run typecheck
          npm run typecheck:native
          npx --no-install expo install --check
          npx --no-install expo-doctor
          npm run ads:check
      - name: Generate Android project only — no APK and no release bypass
        run: npx --no-install expo prebuild --platform android --no-install --clean
      - name: Inspect generated Android configuration
        shell: bash
        run: |
          test -f android/settings.gradle
          test -f android/app/build.gradle
          grep -R "com.sqldpass.app.internal" android/app/build.gradle android/app/src/main/AndroidManifest.xml android/app/src/main/java android/app/src/main/kotlin 2>/dev/null || true
          git status --short > /tmp/android-prebuild-status.txt
          printf 'Android prebuild generated successfully. This is source/config evidence only; no APK, Gradle compile, device, content-complete build, or live ad test was performed.\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqld-android-prebuild-${{ github.sha }}
          path: |
            /tmp/android-prebuild-status.txt
            android/app/build.gradle
            android/settings.gradle
            android/gradle.properties
            android/app/src/main/AndroidManifest.xml
          retention-days: 7
          if-no-files-found: warn
